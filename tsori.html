<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You So Much Babi Zoi</title>
  <link rel="stylesheet" href="tsori.css">
</head>
<body>
  <div class="glow"></div>
  
  <!-- Floating hearts layer -->
  <div class="heart-layer" id="heartLayer"></div>

  <!-- Main Love Card -->
  <div class="love-card" id="loveCard">
    <div class="main-message">I LOVE YOU</div>
    <div class="sub-message">so much</div>
    <div class="babi-zoi">Babi Zoi</div>
    <div class="babi-zoi-sub">forever &amp; always</div>
    <div class="divider"></div>
    
    <!-- Button to reveal bouquet -->
    <button class="gift-btn" id="giftBtn">
      <span class="btn-icon">🌻</span>
      Click for a surprise
      <span class="btn-icon">🌻</span>
    </button>
  </div>

  <!-- Bouquet Reveal Card (hidden initially) -->
  <div class="bouquet-card" id="bouquetCard">
    <div class="bouquet-container">
      <!-- Sunflowers will be generated by JS -->
      <div class="sunflowers" id="sunflowers"></div>
      <div class="bouquet-base"></div>
    </div>
    
    <div class="message-title">For You, My Love</div>
    <div class="message-text">
      Babi Zoi, these sunflowers are for you — <br>
      they always turn to the light, just like my heart <br>
      always turns to you. <br>
      <span class="highlight">I love you so much.</span>
    </div>
    
    <button class="back-btn" id="backBtn">
      ← Read it again
    </button>
  </div>

  <script src="tsori.js"></script>
</body>
</html>
